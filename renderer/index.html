<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css">
<title>Zero Desk</title>
</head>
<body>
<div class="app">

  <header class="titlebar">
    <div class="tabs" id="tabs"></div>
    <button class="tabadd" id="btnNewGroup" title="新建分区">＋</button>
    <div class="winbtns">
      <button class="wb" id="btnSettings" title="设置"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a1.9 1.9 0 1 1-2.69 2.69l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.9 1.9 0 1 1-3.8 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.9 1.9 0 1 1-2.69-2.69l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3.3a1.9 1.9 0 1 1 0-3.8h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.9 1.9 0 1 1 2.69-2.69l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47V3.3a1.9 1.9 0 1 1 3.8 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.9 1.9 0 1 1 2.69 2.69l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.9 1.9 0 1 1 0 3.8h-.09a1.6 1.6 0 0 0-1.47.97z"/></svg></button>
      <button class="wb" id="btnMin" title="最小化">—</button>
      <button class="wb" id="btnMax" title="最大化">▢</button>
      <button class="wb close" id="btnClose" title="关闭">✕</button>
    </div>
  </header>

  <main class="body">
    <div class="grouphead" id="groupHead">
      <button class="giconbtn" id="btnGroupIcon" title="点击更换分区图标">
        <img id="gIcon" class="gicon" alt="">
        <span class="giconmask">换图标</span>
      </button>
      <div class="gtext">
        <div class="gname" id="gName">分区</div>
        <div class="gmeta" id="gMeta"></div>
      </div>
      <button class="addbtn" id="btnAdd">＋ 添加软件</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty hidden" id="empty">
      <div class="etitle">这个分区还是空的</div>
      <div class="esub">点右上角「添加软件」，或把 exe / 快捷方式拖进来</div>
    </div>

    <div class="nogroup hidden" id="noGroup">
      <div class="etitle">还没有任何分区</div>
      <div class="esub">点左上角的「＋」新建一个，它会出现在顶部标签栏里</div>
      <button class="addbtn" id="btnNewGroup2">＋ 新建分区</button>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statusText">双击桌面上的 Zero Desk 图标，就能打开这个面板</span>
  </footer>
</div>

<div class="panel hidden" id="settings">
  <div class="ptitle">设置</div>
  <div class="prow">
    <span class="plabel">主题</span>
    <div class="seg" id="segTheme">
      <button data-v="system">跟随系统</button>
      <button data-v="light">浅色</button>
      <button data-v="dark">深色</button>
    </div>
  </div>
  <div class="prow">
    <span class="plabel">界面材质</span>
    <div class="seg" id="segMat">
      <button data-v="solid">纯色</button>
      <button data-v="acrylic">亚克力</button>
      <button data-v="mica">云母</button>
    </div>
  </div>
  <label class="prow check">
    <input type="checkbox" id="chkTray">
    <span>关闭窗口时收进托盘（下次点分区秒开）</span>
  </label>
  <div class="prow">
    <span class="plabel">图标大小</span>
    <div class="seg" id="segIcon">
      <button data-v="s">紧凑</button>
      <button data-v="m">标准</button>
      <button data-v="l">大</button>
    </div>
  </div>
  <div class="prow">
    <span class="plabel">桌面入口</span>
    <div class="seg" id="segEntry">
      <button data-v="single" title="桌面只有一个主入口，双击它打开全部分区">单一主入口</button>
      <button data-v="multi" title="每个分区在桌面各占一个图标">每区一个图标</button>
    </div>
  </div>
  <div class="prow">
    <span class="plabel">桌面图标</span>
    <div class="seg" id="segClean">
      <button data-v="ask">每次问</button>
      <button data-v="trash">收走</button>
      <button data-v="keep">保留</button>
    </div>
  </div>
  <div class="prow">
    <span class="plabel">维护</span>
    <div class="pbtns">
      <button class="pbtn" id="btnMainLnk">重建桌面主入口</button>
      <button class="pbtn" id="btnRefreshIcons">重新抓取图标</button>
      <button class="pbtn" id="btnCleanDupes">收走桌面重复图标</button>
    </div>
  </div>
</div>

<div id="menu" class="menu hidden"></div>
<div id="modalRoot"></div>
<div id="noticeRoot"></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
